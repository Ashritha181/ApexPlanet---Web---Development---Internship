<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Weather App</h1>
        <p>Check the current weather</p>
    </header>

    <main class="container">

        <section class="weather-card">

            <h2>Weather Information</h2>

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">Search Weather</button>

            <div id="weatherResult">
                <p>Enter a city to check its weather.</p>
            </div>

        </section>

            <!-- Interactive Quiz -->
        <section class="quiz-card">

            <h2>Web Development Quiz</h2>

            <p id="question">What does HTML stand for?</p>

            <button onclick="checkAnswer('a')">
                A. Hyper Text Markup Language
            </button>

            <button onclick="checkAnswer('b')">
                B. High Text Machine Language
            </button>

            <button onclick="checkAnswer('c')">
                C. Hyperlink Text Management Language
            </button>

            <p id="quizResult"></p>

            <button onclick="nextQuestion()">Next Question</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
